name: Build EdgeHide Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'EdgeHide/**'
      - '.github/workflows/build-edgehide-windows.yml'
permissions:
  contents: read
concurrency:
  group: edgehide-windows-main
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official AutoHotkey runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'AutoHotkey.zip'
          $runtimeDir = Join-Path $env:RUNNER_TEMP 'autohotkey-runtime'
          Invoke-WebRequest -Uri 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.29/AutoHotkey_2.0.29.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $runtimeDir -Force
          $runtime = Get-ChildItem -LiteralPath $runtimeDir -Recurse -Filter 'AutoHotkey64.exe' -File | Select-Object -First 1
          if (-not $runtime) { throw 'AutoHotkey64.exe missing' }
          $ahkSource = Get-Content -LiteralPath 'EdgeHide/src/EdgeHide.ahk' -Raw -Encoding UTF8
          if ($ahkSource -notmatch '#Requires AutoHotkey v2') { throw 'AutoHotkey v2 version guard missing' }
          Write-Host 'AHK source checked statically; GUI runtime behavior requires desktop verification'
          New-Item -ItemType Directory -Force -Path 'EdgeHide/dist' | Out-Null
          Copy-Item -LiteralPath $runtime.FullName -Destination 'EdgeHide/dist/EdgeHide.exe'

      - name: Embed EdgeHide script as Win32 RCDATA resource
        shell: pwsh
        run: |
          ./EdgeHide/tools/embed-script.ps1 -ExePath 'EdgeHide/dist/EdgeHide.exe' -ScriptPath 'EdgeHide/src/EdgeHide.ahk'
          if ((Get-Item 'EdgeHide/dist/EdgeHide.exe').Length -lt 100000) { throw 'Standalone EXE is too small' }
          Get-FileHash 'EdgeHide/dist/EdgeHide.exe' -Algorithm SHA256 | Format-List

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { throw 'Inno Setup compiler missing' }

      - name: Create EdgeHide installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'EdgeHide\installer\EdgeHide.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'EdgeHide/dist/EdgeHide-Setup-0.1.0-win-x64.exe')) { throw 'Installer missing' }

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgeHide-Windows-x64
          path: |
            EdgeHide/dist/EdgeHide.exe
            EdgeHide/dist/EdgeHide-Setup-0.1.0-win-x64.exe
          if-no-files-found: error
          retention-days: 30
